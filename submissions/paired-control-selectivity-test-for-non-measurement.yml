model_specificity: model agnostic
domain_specificity: domain agnostic

usage_details: |
  Apply the method to AI TEVV evaluators, governance verifiers, gates, monitors,
  or other software components that emit a measurement status. Construct each
  control-degenerate pair from the semantics of the measurement being tested,
  keep configuration and surrounding conditions matched between the two
  executions, and report per-case outcomes together with coverage.

  The method is intended to detect vacuous positive assurance caused by empty
  inputs, missing baselines, unreadable sources, empty denominators, or
  comparable non-measurement conditions. It tests the selectivity of the
  measurement path; it does not by itself establish that the underlying AI
  system is safe, correct, or compliant.

  The exact Paired-Control Selectivity Test for Non-Measurement submitted here
  is newly proposed and currently primarily submitter-grounded. Its primary
  methodological specification is The Measurement Axioms v1.0.0, specifically
  MA-6.1 (paired selectivity). No independent validation, peer review of this
  exact method, standardization, or external adoption is claimed.

known_failure_modes: |
  1. Pair validity: if the control is not genuinely measurable, or the degenerate
     variant is not actually a non-measurement condition, the pair cannot support
     a selectivity conclusion.
  2. Status interpretation: adapting legacy or implementation-specific outputs
     into measurement statuses can introduce classification error. Uninterpretable
     outputs should remain inconclusive rather than being guessed.
  3. Coverage limits: passing the supplied pairs establishes selectivity only for
     the exercised degenerate classes; it does not establish absence of false
     passes for untested classes.
  4. State and nondeterminism: shared mutable state, order effects, or unmatched
     execution conditions can invalidate the comparison unless the two sides of
     each pair are isolated appropriately.
  5. Evidence maturity: this exact method has not yet been independently
     validated. The peer-reviewed literature cited below supports a constituent
     methodological idea rather than validating this exact AI TEVV procedure.

