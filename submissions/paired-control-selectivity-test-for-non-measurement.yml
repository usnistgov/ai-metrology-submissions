schema_version: "1.0"

name: Paired-Control Selectivity Test for Non-Measurement

applied_definition: |
  A paired-control measurement procedure for testing whether an AI TEVV or governance evaluator
  distinguishes a genuinely measurable input from a degenerate variant for
  which the claimed measurement cannot validly be made. For each case, run the
  same evaluator under matched conditions on a measurable control and on its
  paired degenerate variant. The case passes only when the control yields an
  admissible measured status and the degenerate variant yields its required
  non-measurement status; if a measurable control is paired with another status
  on the degenerate side, the case fails. An invalid or uninterpretable control,
  or a returned shape with no interpretable measurement status, is
  INCONCLUSIVE. If the target cannot accept the case inputs, the case is
  NOT_MEASURED; execution or status-classification failures are ERROR. Report
  per-case outcomes and exercised-case coverage. Zero exercised cases yields
  NOT_MEASURED, not PASS.

submitter_organizations:
