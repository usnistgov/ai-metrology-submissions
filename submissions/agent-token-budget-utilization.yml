schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: Agent Token Budget Utilization
applied_definition: |
  How much of its token budget an agent actually burned in a single
  invocation.

  $$\mathrm{TBU} = \frac{\text{tokens\_consumed}}{\text{token\_budget\_limit}}$$

  tokens_consumed = total input + output tokens across all LLM calls in one
  agent invocation. Sub-agent tokens are excluded—otherwise the numbers
  double-count when you roll up to a parent. token_budget_limit is simply the
  cap the orchestrator set for that invocation.

  TBU tells you how the agent stopped. Well below 1.0, the agent finished on
  its own terms—it stopped because it was done, and you can evaluate its
  output against task requirements normally. The interesting case is when TBU
  approaches 1.0. That means the agent was killed by budget enforcement, and
  the output is whatever partial state existed at the moment the plug was
  pulled. You can't validate it in the ISO 9000:2015 sense—objective evidence
  that requirements for intended use have been fulfilled—because the reasoning
  process that would produce such evidence was terminated externally. (The
  NIST AI RMF uses the same definition of validation, for what it's worth.)

  This is a reliability problem under the AI RMF's Valid and Reliable
  characteristic. Reliability means performing as required under given
  conditions (ISO/IEC TS 5723:2022). An agent that hit its token ceiling
  didn't meet those conditions. Full stop. And this isn't just correlational—
  test-time compute scaling research (Snell et al. 2024) shows output quality
  degrades as a direct function of inference budget.

  Reported as a histogram across invocations. Look at the percentiles—P95
  TBU above 0.9 means your agents are routinely hitting budget walls instead
  of finishing their work, and that should concern you.
