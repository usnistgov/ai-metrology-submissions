common_variants:
  - Cost Budget Utilization (monetary spend / cost cap, in currency units)
  - Iteration Budget Utilization (iterations consumed / iteration limit)
  - Time Budget Utilization (wall-clock duration / timeout)
related_metrics:
  - Agent Iteration Budget Utilization
  - Token Consumption Rate (tokens per second per invocation)
  - Agent Completion Rate (tasks completed normally vs budget-terminated)
computational_requirements: >-
  Negligible. Requires only arithmetic division on two counters already
  maintained by the agent framework's budget enforcement mechanism. No
  additional inference calls or GPU resources needed.
