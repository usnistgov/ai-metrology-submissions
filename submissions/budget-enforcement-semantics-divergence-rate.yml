model_specificity: model agnostic

domain_specificity: domain agnostic

usage_details: |
  Applied by defining a standardised workload plus declared budget policy,
  executing it across each available agent framework, and comparing the
  reported consumption values pairwise.

  Concrete application: an 11-framework differential harness (see
  implementation resources) applied the same tool-calling workload under
  identical budget constraints, so $K = 11$. Eight frameworks were
  executed directly; Google ADK and Anthropic were assessed by source
  inspection, and Swarm was executed at 0.1.0 though archived upstream.
  Frameworks disagreed on what to count (tokens vs. dollars vs. both),
  when to trigger enforcement, and how to account for framework-external
  tool calls. Agno reports no enforcement of a declared budget at all,
  which under this definition is itself a divergence rather than a missing
  measurement.

known_failure_modes: |
  Sensitive to workload construction: workloads that do not exercise the
  edge cases of budget-accounting (framework-external tool calls, mixed
  token/dollar policies, streaming responses, mid-execution cancellation)
  will report artificially low rates.

  The aggregate rate does not attribute divergences to specific accounting
  rules or to a specific dimension of the $C()$ tuple. Reporting the
  per-dimension divergence rate (tokens-only, spend-only, resource-events-only)
  alongside the aggregate rate is recommended.

  Stratified reporting of $D$ is recommended in two strata: (a) shared-dimension
  disagreement (both frameworks report the same dimension with different values)
  and (b) coverage non-overlap ($\bot$ on one side, concrete on the other). The
  unstratified rate mixes "the frameworks disagree on the accounting" with "the
  frameworks don't report the same accounting"; separating them via the two
  strata clarifies which failure mode a measurement is exposing.


  A framework that enforces no declared budget diverges from every
  enforcing framework on every workload, so including one saturates $D$ at
  1.0 irrespective of how the remaining implementations behave. Report the
  rate with non-enforcing frameworks excluded, alongside their count, and
  state the composition of $K$ for any reported rate. In the reference
  survey Agno is the non-enforcing case.
modality:
  - text
  - structured data

