schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: Budget Enforcement Semantics Divergence Rate Across AI Agent Frameworks

applied_definition: |
  The fraction of standard workload cases for which independent AI agent
  frameworks disagree on the reported budget consumption of the same
  underlying work.

  For a workload $w$ with declared budget policy $B$ and $K$ agent
  frameworks $\{F_1, ..., F_K\}$ each capable of executing $w$ under $B$,
  each framework returns a consumption record
  $C(F_j, w, B) = (t_j, d_j, r_j)$ where $t_j$ is total input+output
  tokens consumed, $d_j$ is total spend in USD computed against a
  fixed price table supplied with the measurement, and $r_j$ is an
  ordered record of resource-event counts (tool-call count, retry
  count, streaming chunks). Frameworks that do not natively report a
  dimension, or that route to a model absent from the supplied price
  table, emit the reserved value $\bot$ for that position; equality
  is defined element-wise with $\bot = \bot$ and $\bot \neq v$ for
  any concrete value $v$. The ensemble divergence rate over $N$
  workloads ($N \geq 30$ recommended) is

  $$ D = \frac{1}{N} \sum_{i=1}^{N} \mathbb{1}\left[\exists\, F_j, F_k\ :\ C(F_j, w_i, B) \neq C(F_k, w_i, B)\right] $$

  and the pairwise divergence rate for an unordered framework pair
  $\{F_j, F_k\}$ is

  $$ D_{jk} = \frac{1}{N} \sum_{i=1}^{N} \mathbb{1}\left[C(F_j, w_i, B) \neq C(F_k, w_i, B)\right] $$

  The ensemble rate $D$ is reported per budget-policy form; the
  pairwise rates $D_{jk}$ are reported per unordered framework pair.
  Recommended confidence interval: Wilson score at $\alpha = 0.05$;
  cluster-adjusted Wilson where workloads share a generator.

