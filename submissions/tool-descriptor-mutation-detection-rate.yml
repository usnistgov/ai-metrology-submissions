schema_version: "1.0"

name: Tool-Descriptor Mutation Detection Rate

applied_definition: |
  Fraction of tool-definition fields whose modification is detected by a client
  that pins the definition, measured one field at a time.

  For one tool and one client under test:

  1. Serve a baseline `tools/list` response and let the client pin it.
  2. Fix the field set F: every field of the tool definition except the one the
     client uses as the pin's identity key. For MCP 2025-06-18, `name` is
     normally the identity key, leaving F = {`_meta`, `annotations`,
     `description`, `inputSchema`, `outputSchema`, `title`}.
  3. For each field f in F, re-serve the identical listing with only f changed
     to a semantically different value, and record whether the client reports a
     mutation. `applied` counts the fields actually mutated; `detected` counts
     those reported.
  4. Required control: re-serve the baseline listing unchanged and confirm the
     client reports nothing. If the control is flagged, the run is void. A
     client that flags every re-listing scores 1.0 while detecting nothing.

  $$ \mathrm{TDMDR} = \frac{\mathit{detected}}{\mathit{applied}} $$

  Report three things together: the rate, the field set F used, and the
  undetected fields by name. The rate alone is not interpretable without them.

