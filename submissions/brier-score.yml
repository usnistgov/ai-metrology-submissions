schema_version: "1.0"

name: Brier Score

applied_definition: |
  The Brier Score measures the accuracy of probabilistic predictions. For $N$
  observations and $C$ mutually exclusive classes, it is

  $$BS = \frac{1}{N}\sum_{i=1}^{N}\sum_{c=1}^{C}(\hat{p}_{ic}-y_{ic})^2,$$

  where $\hat{p}_{ic}$ is the predicted probability that observation $i$
  belongs to class $c$, $\hat{p}_{ic}\in[0,1]$,
  $\sum_{c=1}^{C}\hat{p}_{ic}=1$, and $y_{ic}$ is 1 when the observation
  belongs to that class and 0 otherwise. Lower values are better, and 0 is a
  perfect score. The unscaled multiclass form ranges from 0 to 2.

  For a binary event, the customary form is

  $$BS = \frac{1}{N}\sum_{i=1}^{N}(\hat{p}_{i}-y_{i})^2,$$

  where $\hat{p}_{i}\in[0,1]$ and $y_i\in\{0,1\}$. This form ranges from 0 to
  1. The Brier Score is a strictly proper scoring rule: in expectation, it is
  minimized by reporting the forecaster's true probability.

