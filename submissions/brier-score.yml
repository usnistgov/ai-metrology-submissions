common_variants:
  - Binary Brier Score
  - Multiclass Brier Score
  - Sample-weighted Brier Score
  - Brier Skill Score

related_metrics:
  - Log loss
  - Calibration curve or reliability diagram
  - Expected Calibration Error
  - Brier Score decomposition into reliability, resolution, and uncertainty
  - Area under the receiver operating characteristic curve

computational_requirements: >-
  CPU only. Requires predicted probabilities and observed outcome labels for
  the evaluation set. No specialized hardware is needed.

