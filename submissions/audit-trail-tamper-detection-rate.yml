schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: Audit-Trail Tamper-Detection Rate for AI Agent Tool Invocations

applied_definition: |
  For $M_c$ tampering attempts $\{a_1, ..., a_{M_c}\}$ in attack class
  $c \in \{\text{edit, delete, reorder, equivocation-fork}\}$ applied
  to a stream of audit records produced by an audit-trail system $A$,

  $$ R_{\text{detect}}(A, c) = \frac{1}{M_c} \sum_{i=1}^{M_c} \mathbb{1}\left[V(A, a_i) = \text{detected}\right] $$

  where $V(A, a_i)$ is the verifier's output on the tampered chain. The
  four attack classes are: edit (a single field mutation in a record),
  delete (removal of one record from the chain), reorder (swap of two
  adjacent records without content mutation), and equivocation-fork
  (signing a second suffix from an already-signed prefix so that two
  divergent chains share a common committed head). The false-positive
  companion rate $R_{\text{FP}}(A)$ is the fraction of untampered chains
  the verifier flags as tampered. $R_{\text{detect}}$ is reported per
  attack class $c$ and per chain-length window (measured in records,
  with $M_c \geq 30$ recommended per class per window); $R_{\text{FP}}$
  is reported per chain-length window only, since it is measured on
  untampered chains and has no attack class. Recommended confidence
  interval: Wilson score at $\alpha = 0.05$; cluster-adjusted Wilson
  where attack instances within a class share a generator.

