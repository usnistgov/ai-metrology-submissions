# --- Section 2: Context and limitations ---
ai_rmf_characteristics:
  - Accountable & Transparent
  - Secure & Resilient
  - Valid & Reliable

primary_tevv_application:
  - Privacy & Security Evaluation

ai_lifecycle_stages:
  - Deploy
  - Operate & Monitor

object_of_measurement:
  - system
  - agent

model_specificity: model agnostic

domain_specificity: domain agnostic

usage_details: |
  Applied by generating a controlled workload, applying a curated set of
  tampering attacks (edit, delete, reorder, equivocation-fork), and
  running the verifier against the tampered chain.

  Supports direct comparison across audit-trail architectures at fixed
  attack corpus: hash-chained records authenticated by Ed25519 or by
  HMAC-SHA256, with or without periodic on-chain anchoring. Comparable
  axes are detection rate, false-positive rate, per-event verifier
  latency, and per-event storage.

  Reported per system under test, so the same attack classes can be
  compared across independent audit-trail architectures.

known_failure_modes: |
  Detection rate against an incomplete attack corpus overestimates
  real-world resilience. Attack corpora should include
  semantic-equivalence tamperings (values that produce identical
  canonical form across SDKs, per the companion Cross-SDK Wire-Level
  Divergence Rate metric) as well as byte-level tamperings.

  Does not measure resistance to agent-internal log fabrication, which
  is a distinct threat model addressed by external audit gateways
  rather than by the audit-trail system itself.

modality:
  - text
  - structured data

