implementation_resources:
  - >-
    Independent replication resource, the Agent Flight Recorder evaluation
    artifact, which injects the same four attack classes and reports
    per-class detection rates across five configurations (eval/tamper.py,
    eval/bench_rq3.py, artifacts/paper/reference/rq3.json), MIT licensed
    and pinned at commit 28ddcde:
    https://github.com/mpi-dsg/agent-flight-recorder/tree/28ddcde9c133bd10e9a500cc7e38e3d70d8baa86
  - >-
    mcp-audit-gateway (Ed25519 and HMAC-SHA256 signing, hash-chain and
    checkpoint verification), pinned at v0.8.1:
    https://github.com/elang2/mcp-audit-gateway/tree/v0.8.1
    Released software (11 releases; v0.8.1; @mcp-audit-gateway/core, 0.8.0
    on npm). The repository was created 2026-08-17 and is not yet widely
    adopted, so it is cited as a reproduction path rather than as an
    established tool. It supplies the audit-trail primitives the metric is
    applied to; the four-class detection measurement itself is demonstrated
    by the Agent Flight Recorder artifact above.
  - >-
    Cross-language conformance vectors (JS + Python parity, 46 cases),
    pinned at v0.8.1:
    https://github.com/elang2/mcp-audit-gateway/blob/v0.8.1/test/vectors/checkpoint.json
    Exercised by the paired verifiers verify-checkpoint.mjs and
    verify-checkpoint.py in the same directory, which each report 46 of 46
    checks passing.

related_metrics:
  - Verifier per-event latency
  - Bytes-per-event storage overhead
  - Anchoring cost per 100K events
  - Cross-SDK Wire-Level Divergence Rate (companion; supplies the semantic-equivalence tampering class)

computational_requirements: >-
  Verifier: single-core CPU sufficient for chain length under 1M events.
  Signing/MAC throughput bounded by the underlying authentication
  primitive (Ed25519 or HMAC-SHA256). No GPU required.

