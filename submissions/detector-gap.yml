# --- Format version ---
format_version: "1.0"

# --- Section 1: Identification and attribution ---
name: Detector Gap
applied_definition: |
  The measured drop in a safety detector's hit rate between a hazard in its
  canonical form and semantically equivalent obfuscations of that same hazard.
  It measures the *detector*, not the model under test.

  The method evaluates a paired control set, where each pair is one hazard
  expressed twice: a surface form the detector is expected to catch, and an
  obfuscated form that preserves the hazard while changing its surface syntax.

  $$\mathrm{DG} = \frac{1}{|S|}\sum_{i \in S} \mathbb{I}(d_i) \;-\;
  \frac{1}{|O|}\sum_{j \in O} \mathbb{I}(d_j)$$

  where $S$ is the set of surface controls, $O$ the set of obfuscated controls
  derived from them, and $\mathbb{I}(d)$ is 1 when the detector fires on that
  item and 0 otherwise. The two terms are reported alongside the gap as
  `surface_pass_rate` and `obfuscated_pass_rate`.

  Two properties are essential to reading the result correctly:

  1. **It is a floor, not a ceiling.** DG = 0.8 establishes that at least 80% of
     detections are defeated by the transforms actually tested. It says nothing
     about transforms not in the control set, so it can never certify coverage —
     only demonstrate a lower bound on the blind spot. Report it as the
     *minimum measured blind spot*.
  2. **The gap is only defined over control membership.** Items outside the
     paired set must be excluded rather than defaulted into the surface pool,
     or the surface rate drifts toward the general benchmark pass rate and the
     gap becomes arithmetic between two unrelated populations.

  An unmeasured gap must be reported as absent, never as zero. A detector with
  no control set has an *unknown* blind spot, which is a materially different
  claim from a measured blind spot of zero, and collapsing the two is the
  failure mode this metric exists to prevent.
