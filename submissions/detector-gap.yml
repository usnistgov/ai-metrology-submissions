domain_specificity: domain agnostic
usage_details: |
  Applies wherever a deterministic or learned detector gates AI output or input:
  guardrail filters, prompt-injection classifiers, insecure-output-handling
  scanners, and CI security gates that block on detector findings.

  Its primary value is as a companion measurement to headline safety scores.
  Metrics such as Jailbreak Success Rate quantify how often a system fails
  against the tests that were run; Detector Gap quantifies how much of that
  result is an artifact of the test set's surface form. A near-zero attack
  success rate paired with a high Detector Gap indicates a detector that is
  matching syntax rather than hazard, which is not visible from the headline
  number alone.

  It is also usable as a regression gate: a rising gap across catalog versions
  shows detection coverage degrading relative to the transforms already known,
  independently of whether the underlying model changed.

  Reporting requirement: the gap is only interpretable next to the version of
  the detector catalog it was measured against, since the denominator changes
  whenever rules are added or removed. Publish the pair, not the score alone.

  The method is independent of any particular detector or corpus. Computing it
  requires only a detector that emits a binary fire/no-fire decision and a
  paired corpus in which each hazard appears in both a canonical and an
  obfuscated form. The resources listed below are one worked example, chosen
  because their catalog is versioned and immutable, and are not a dependency of
  the measurement.
known_failure_modes: |
  1. **Adversarial construction inflates the number.** A control set is built by
     choosing transforms and confirming they defeat the detector. A gap near
     1.0 therefore demonstrates that the chosen transforms work, not that the
     detector is broadly blind. The figure observed for the cited catalog is
     exactly 1.0 across four transform families, and it must be read as an
     existence proof rather than a coverage estimate. Disclosure of how that
     number was produced, since criterion 4 below sets a bar it does not fully
     meet: the transforms were authored by an independent contributor, but the
     work was scoped in public discussion with the detector's own maintainer,
     who declared that conflict of interest at the outset. It is a
     collaboration with a disclosed conflict, not an arms-length third-party
     measurement.
  2. **Not comparable across control sets.** Two systems measured with different
     transform families produce gaps that cannot be ranked against each other.
     The metric is designed for tracking one detector over time, or for
     comparing detectors on an identical published control set.
  3. **Semantic equivalence is an assumption, not a guarantee.** If a transform
     silently neuters the hazard, the obfuscated item is a true negative and the
     gap is overstated. Each pair needs the hazard preserved and verified
     independently of the detector being measured.
  4. **Gameable by construction if the control set is author-controlled.** A
     vendor measuring its own detector can choose transforms it already handles
     and publish a gap near zero. The metric is only meaningful with a control
     set that is published, versioned, and separable from the detector's author.
  5. **Silent under-reporting when a run is bounded.** If a harness caps results
     or a control family fails to execute, an unpopulated pool can be mistaken
     for a measured zero. Runs must distinguish "not measured" from "measured as
     zero" explicitly.
modality:
  - text

