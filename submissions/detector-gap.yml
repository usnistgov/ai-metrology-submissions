    (2023). "Not what you've signed up for: Compromising Real-World
    LLM-Integrated Applications with Indirect Prompt Injection."
    arXiv:2302.12173. https://arxiv.org/abs/2302.12173
  - >-
    OWASP Foundation (2025). "OWASP Top 10 for Large Language Model
    Applications — LLM05:2025 Improper Output Handling."
    https://genai.owasp.org/llm-top-10/ (This category was named "LLM02:
    Insecure Output Handling" in the v1.1 edition; tooling and literature
    predating the 2025 renumbering, including some cited below, still use the
    older label.)
implementation_resources:
  - >-
    https://github.com/EleutherAI/lm-evaluation-harness/pull/3809 — in-progress
    integration as an lm-evaluation-harness task. Status as of this submission:
    the five-field result schema (surface_pass_rate, obfuscated_pass_rate,
    detector_gap, catalog_version, catalog_uri) is settled and merged into the
    branch, but the two obfuscation-side aggregations deliberately return null
    rather than zero because the control fixtures land separately, in draft PR
    3973. The four-family figure cited above was produced by that draft's own
    test suite against the fixtures, not yet by the harness's aggregation. One
    open design question remains: the envelope's pass-rate fields and the
    controls' detection-rate fields are opposite in polarity, and which
    convention the aggregation adopts is not yet decided. The design discussion
    is at issues/3771 and in both pull request threads.
  - >-
    https://github.com/ppcvote/prompt-defense-audit-py/releases/tag/v0.1.0 —
    versioned detector catalog measured against (22 rules across 7 hazard
    families), published with an explicit immutability and deprecation contract
    so a reported gap stays reproducible against the version it was measured on.
  - >-
    https://github.com/ppcvote/prompt-defense-audit — MIT-licensed reference
    detector (TypeScript and Python ports with enforced parity), zero runtime
    dependencies.
related_metrics:
  - Jailbreak Success Rate (JSR)
  - Attack Success Rate (ASR)
  - False Negative Rate
computational_requirements: >-
  Low. The detector side is deterministic pattern matching and runs on CPU in
  milliseconds; cost is dominated by generating or curating the paired control
  set, which is a one-time authoring task rather than a per-run inference cost.
