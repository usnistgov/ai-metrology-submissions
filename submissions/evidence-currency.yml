usage_details: |
  Use it at a release or deployment decision, to check that the evaluations a
  release cites (in a model card, assurance case or release checklist) were run
  on the exact files shipped.

  Example. A safety evaluation passed over a system prompt, a guardrail policy,
  a tool definition and an evaluation set. The prompt is then edited and a
  second tool added. At release, currency is 3/5 (60%): one file stale (re-run
  needed), one never examined (first run needed), while the recorded results
  still read 4 of 4 PASS. The linked example runs this scenario. A per-step
  threshold (e.g. 100% for a safety evaluation) can be set without changing
  what is measured.

  Grounding: a newly proposed measurement, specified by the applied_definition
  above; the submitter knows of no peer-reviewed source that defines it. Its
  validity rule (a result holds only while its inputs' hashes are unchanged) is
  the one used in regression test selection (Gligoric et al., 2015). Its
  per-step check of recorded evidence against the hashes of delivered artifacts
  follows in-toto (Torres-Arias et al., 2019). The implementation is a
  single-author proof of concept used in one environment; it is not
  production-ready and has not been independently replicated.

known_failure_modes: |
  1. Records are not re-run. A fabricated or mistaken record counts as
     current; the metric is only as trustworthy as whatever writes records.
  2. Scope sets the denominator. Files a check depends on but its scope omits
     are in no state, so currency can read 100% while they were never
     examined. Scope declarations need their own review.
  3. Checker changes (a new evaluator version or threshold) leave earlier
     verdicts current unless the checker's files are declared as dependencies
     of the step (`switches`).
  4. Untracked inputs (weights fetched at run time, remote APIs, environment
     variables, seeds) can change without making any verdict stale.
  5. A file renamed with unchanged bytes counts as never examined until a
     verdict names the new path.
  6. Not a quality measure: currency can be 100% with every verdict a FAIL.
     Read it per step and alongside outcomes.

references:
