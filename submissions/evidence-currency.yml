schema_version: "1.0"

name: Evidence Currency

applied_definition: |
  Evidence currency measures, at the moment a release or deployment decision is
  made, whether the recorded check results behind that decision still describe
  the exact content being released.

  A *verdict* is a recorded result of a check (an evaluation run, a red-team
  review, a scanner, a human review). Each verdict is bound to the step $s$ that
  produced it and, for every file it covers, to that file's path $p$ and the
  content hash $h$ of the bytes examined (a git blob id). At a revision $r$, let
  $S_s(r)$ be the paths present at $r$ that step $s$ owes a verdict for: those
  matching its declared scope (minus exclusions), together with any files it
  declares as dependencies of the check itself. Let $h_r(p)$ be the content hash
  of $p$ at $r$. Each pair $(s, p)$ with $p \in S_s(r)$ is in exactly one state:

  - **current**: a verdict exists for $(s, p, h_r(p))$;
  - **stale**: a verdict exists for $(s, p)$, but only at hashes other than
    $h_r(p)$;
  - **never examined**: no verdict exists for $(s, p)$ at any hash.

  Per step, with $n_s = |S_s(r)| = c_s + t_s + u_s$ (current, stale, never
  examined):

  $$\mathrm{currency}_s(r) = \frac{c_s}{n_s}$$

  and over all (step, path) pairs of applicable steps:

  $$\mathrm{currency}(r) = \frac{\sum_s c_s}{\sum_s n_s}$$

  Reporting rules, all part of the method:

  1. $c_s$, $t_s$ and $u_s$ are always reported alongside the ratio, never only
     the ratio.
  2. A step that does not apply at $r$ (its scope is empty, its applicability
     condition matches no file, or the decision being made does not require it)
     is reported as **not applicable**, with currency undefined (null), and is
     excluded from the aggregate. An empty scope is never reported as 100%.
  3. A current verdict counts as current whatever it recorded (pass, fail or
     undecided). Currency is a property of the evidence, not of the outcome;
     outcomes are reported separately.

