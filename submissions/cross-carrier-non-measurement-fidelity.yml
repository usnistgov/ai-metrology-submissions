object_of_measurement:
  - system
model_specificity: model agnostic
domain_specificity: domain agnostic
modality:
  - structured data
usage_details: |
  For AI evaluation and agent-governance pipelines that convert one
  measurement-status record into OCSF, OpenTelemetry, SARIF, in-toto,
  ECS/HEC, W3C Agent Conformance, or OASF representations.
  The method is especially relevant when a missing grader run, inaccessible
  evidence, or an untestable check must never turn into a numeric zero or a
  successful assurance label downstream. The same records and adapters
  must be version-pinned, with an explicit mapping contract per carrier.

  This submission is distinct from NIST community PR #19 (Paired-Control
  Selectivity Test for Non-Measurement): that method tests whether an
  evaluator distinguishes a measurable control from a degenerate input.
  CNMF checks the downstream fidelity of already-issued non-measurement
  statuses across evidence export formats; it does not test the evaluator's
  ability to produce an adverse result.
known_failure_modes: |
  Export adapters can carry non-measurement information in implementation-
  specific extension fields which another consumer ignores. The test must
  verify documented interpretability, not merely the presence of a string.
  Some carrier schemas contain unrelated numeric metadata; only fields
  presented as measurement/confidence/risk results are prohibited.
  An exporter passing tested fixtures does not establish interoperability
  for untested carrier versions or third-party importers. A supplied event
  with fabricated source state can still export faithfully; this method
  cannot prove the source observation was truthful. Synthetic fixtures
  are not outside independent adoption. Currently published CSOAI tests
  are first-party tests, not independent validation of CNMF as a metric.
references:
  - >-
    Moreau, L. et al. (2011), The Open Provenance Model core specification
    (v1.1), Future Generation Computer Systems 27(6), 743-756.
    https://doi.org/10.1016/j.future.2010.07.005
    (Supports cross-system faithful provenance representations; does not
    independently validate this proposed metric.)
  - >-
    Liu, H., Kuo, F.-C., Towey, D., and Chen, T. Y. (2014), How Effectively
    Does Metamorphic Testing Alleviate the Oracle Problem?,
    IEEE Transactions on Software Engineering 40(1), 4-22.
    https://doi.org/10.1109/TSE.2013.46
    (Supports testing a required relation across transformed outputs,
    not empirical validation of CNMF.)
