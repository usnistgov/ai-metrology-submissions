schema_version: "1.0"
name: Cross-Carrier Non-Measurement Fidelity (CNMF)
applied_definition: |
  A test methodology for assessing whether an AI measurement or evaluation
  record whose source state is UNMEASURED or UNCHECKABLE retains that
  non-measurement meaning when exported into other evidence formats, rather
  than acquiring a numerical evaluation score through a carrier mapping.

  Construct a versioned test corpus containing valid records with an explicit
  source state, a null measured value, stable record identity and at least one
  declared limit. Run each through a named, version-pinned export adapter.
  For every eligible (record, adapter) pair, inspect both output semantics and
  structural validity. The pair passes only when (a) the export is accepted,
  (b) the emitted representation retains an explicit interpretable unknown /
  non-measurement status with its original source state or a documented
  reversible mapping, and (c) it emits no numeric measured value, confidence
  score or risk score purporting to stand for the absent measurement.

  CNMF = passing eligible (record, adapter) pairs / all eligible pairs.
  Report numerator, denominator, adapter versions, per-source-state
  denominators and exclusions. Missing output, ambiguous state mappings and
  incompatible adapters are counted separately and do not become passes.
  An empty eligible set reports NOT_MEASURED rather than 100 percent.
  A second mutation-control test intentionally inserts a numeric score into
  an otherwise consistent UNMEASURED or UNCHECKABLE source record; a
  correctly fail-closed adapter rejects this rather than silently exporting
  the forged score. Report mutation-control outcomes separately from CNMF.

  This measures evidence transport fidelity, not the validity of the original
  evaluation instrument or the accuracy, safety or compliance of an AI system.
submitter_organizations:
  - CSOAI Ltd
contact_email: nicholas@csoai.org
ai_rmf_characteristics:
  - Valid & Reliable
  - Accountable & Transparent
ai_lifecycle_stages:
  - Build
