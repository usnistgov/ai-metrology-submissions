common_variants:
  - Narrative Stripping (NS) — single-operator sub-audit
  - Implicit Assumption Perspective (IAP) — single-operator sub-audit
  - Vulnerability Hedging (LCH) — single-operator sub-audit
  - Responsibility Anchoring (ANCH) — single-operator sub-audit
  - Causal Reconstruction (RECON) — single-operator sub-audit

computational_requirements: >-
  Python 3 standard library only; no third-party packages, no GPU, and no network access
  required for the core audit. The core is single-threaded and CPU-only, and a full
  five-operator audit over a few dozen premises completes in under a second. The
  optional narrative-rendering layer is the only component that can call an external
  language model; it is disabled by default.

