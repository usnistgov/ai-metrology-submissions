schema_version: "1.0"

# --- Section 1: Identification and attribution (all four keys required) -----

name: >-
  Global Cognitive Audit Engine (GCAE) — Five-Operator Causal Audit Methodology

applied_definition: |
  **Subject of measurement.** A decision structure, modelled as the triple
  $(D, \mathcal{A}, \mathcal{B})$: $D$ is an intended action or judgment;
  $\mathcal{A} = \{A_1, \dots, A_n\}$ are the explicit premises on which $D$ depends,
  each required to be falsifiable and non-circular; $\mathcal{B} = \{b_1, \dots, b_n\}$
  are the branch responses, i.e. the structural change to $D$ when $A_i$ fails.

  **Causal continuity predicate.**

  $$p \rightarrow Q$$

  $p$ denotes a principle, rule, or constraint; $Q$ a result, state, or consequence.
  The arrow denotes an inseparable, continuous, non-bypassable causal connection. When
  the continuity between $p$ and $Q$ is severed, obscured, or quietly altered, the
  decision is no longer under governance — it is under narrative.

  **Second-perspective decision formula.**

  $$\neg A \Rightarrow \Delta D$$

  A decision is valid only inside the boundary of its assumptions. For every critical
  assumption $A_i$, the structural consequence of $\neg A_i$ must be stated. A branch
  response is a structural change in $D$ — not a recommendation, and not an
  alternative decision.

  **Structural audit predicate.**

  $$\Phi\{f_s, x, y\} \rightarrow \{\mathrm{True}, \mathrm{False}\}$$

  Given the system function $f_s$ and input conditions $x, y$, $\Phi$ returns whether a
  decision structure meets the minimum requirement of rational consistency. $\Phi$
  produces audit conclusions only: no recommendation, no optimization, no score-based
  guidance.

  **Fragility functional.**

  $$\Delta D(A_i) = \operatorname{clamp}_{[0,1]}\!\Big( w_0 + \sum_{k \in K} w_k \,
  \phi_k(A_i) \Big)$$

  where $\phi_k$ are deterministic fragility factors — branch coverage of $A_i$, the
  number of downstream assumptions depending on $A_i$, vague-quantifier density, and
  falsifiability of $A_i$ — and $w_k$ are fixed weights. $\Delta D$ is recomputed
  identically on every run: no sampling, no randomness, no model call. The audited
  system's fragility is reported as $\max_i \Delta D(A_i)$. $\Delta D$ is an ordinal
  intra-decision ranking, not a calibrated probability.

  **Pipeline.** Five operators run in a fixed order, each also usable alone, and a
  terminal verification stage closes the sequence:

  $$\mathrm{NS} \rightarrow \mathrm{IAP} \rightarrow \mathrm{LCH} \rightarrow
  \mathrm{ANCH} \rightarrow \mathrm{RECON}$$

  1. Narrative Stripping (NS) — removes rhetoric, affect, and vague quantifiers;
     retains the logical core.
  2. Implicit Assumption Perspective (IAP) — surfaces undeclared premises, privilege
     bypass, and circular reasoning.
  3. Vulnerability Hedging (LCH) — computes $\Delta D(A_i)$ per premise; locates the
     most fragile variable and states how the chain can be repaired at that point.
  4. Responsibility Anchoring (ANCH) — assigns each decision exactly one responsibility
     anchor, traced to the minimum decision unit and immutable to subsequent revision,
     plus a tamper-evident SHA-256 audit certificate (audit ID + nonce).
  5. Causal Reconstruction (RECON) — rebuilds the chain after audit, so that it is a
     defensible causal structure rather than a narrative.

  **Terminal verification.** A deterministic fact cleanse runs after the pipeline and
  is not a sixth operator. Every premise admitted into the chain must be either
  established or explicitly marked unestablished; probabilistic qualification, hedged
  quantifiers, and unverified assertions are removed rather than averaged into a score.
  What the cleanse yields is a floor, not a verdict.

  **Verdict.** The reconstructed chain is assigned one of three discrete levels —
  AUDIT_PASS, AUDIT_WARN, or AUDIT_HALT — derived from the operators' boolean outputs,
  with the tamper-evident SHA-256 certificate emitted by Responsibility Anchoring. The
  core runs fully offline with zero external calls; language-model narrative rendering
  is optional, disabled by default, and can never alter a verdict.

  **Theoretical grounding.** The premise/branch-response structure is an instance of
  assumption-based argumentation: a premise $A_i$ is an assumption, and a premise with
  no branch response is an assumption that cannot be attacked, so the structure is
  unassailable by construction. The requirement that the audit artefact be
  recomputable by a party other than the operator follows the tamper-evident
  audit-trail line of work for AI systems. The full specification of the five
  operators, their formal predicates, and the governance-asymmetry condition
  $p \rightarrow Q$ is documented in the archived preprint cited under references
  [3], which is the normative definition of this methodology.

