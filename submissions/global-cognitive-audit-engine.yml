# --- Section 2: Context and limitations (optional) --------------------------

ai_rmf_characteristics:
  - Accountable & Transparent
  - Secure & Resilient
  - Valid & Reliable

primary_tevv_application:
  - Interpretability & Explanation Evaluation

ai_lifecycle_stages:
  - Deploy
  - Use
  - Operate & Monitor

object_of_measurement:
  - system

model_specificity: model agnostic
domain_specificity: domain agnostic

usage_details: |
  Post-incident forensic reconstruction is the primary use case. After an AI system or
  an AI-assisted decision has produced a harmful or disputed outcome, the engine
  reconstructs the decision structure from the recorded artefact and returns a
  deterministic verdict plus a tamper-evident certificate. Because the core is offline,
  deterministic, and model-agnostic, the audit can be run by a party that is not the
  system's operator, on infrastructure the operator does not control, and independently
  re-run later by a third party to the same result.

  Secondary uses: pre-deployment structural review of high-stakes decision pipelines;
  assumption auditing of AI-assisted procurement, allocation, and policy decisions; and
  producing a machine-checkable audit artefact for regulatory reporting obligations.

known_failure_modes: |
  (1) The audit is bounded by the premise set it is given. Assumptions that are never
  declared are never audited; a party that omits the real load-bearing assumption
  reduces the audit's coverage. The engine surfaces what is stated, not what is
  strategically withheld.
  (2) Branch coverage is a declared field. A decision structure can lower its reported
  fragility by attaching a nominal branch response to every premise without any
  substantive change to the decision: presence and structural content of a branch are
  checked, quality of execution is not.
  (3) Narrative stripping uses a deterministic marker lexicon. Paraphrase that avoids
  the lexicon evades stripping; this is why NS output is reported as a derived artefact
  rather than as a verdict.
  (4) The engine asserts facts, locates the most fragile variable, and anchors
  responsibility. It does not block execution, does not enforce runtime policy, and is
  not a substitute for guardrails, kill switches, or access control.
  (5) $\Delta D$ rankings are ordinal. Comparing $\Delta D$ values across unrelated
  decisions is not supported and should not be interpreted as a comparative risk score.

modality:
  - text
  - structured data

