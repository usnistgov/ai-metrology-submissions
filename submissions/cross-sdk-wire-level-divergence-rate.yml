computational_requirements: >-
  Negligible compute; the cost is environment breadth. The harness is a
  POSIX shell driver that runs one serialisation runner per language and
  compares byte outputs, with Python 3 also serving as the comparison
  engine. Invoke it with `--layer sdk` to measure this metric; the default
  also runs a language-stdlib layer whose serialisers are not SDK
  implementations. It requires Node.js as the TypeScript reference and at
  least one other runner; reproducing the reported rate needs all of Python
  3, Go, Swift, PHP, a JDK, Kotlin, and dotnet-script on PATH, with Jackson
  2 (databind, core, annotations) supplied to the Java runner. The Kotlin,
  C#, and PHP runners were executed in containers. The driver probes
  for base toolchains rather than for these supplied dependencies, so a
  runner can be skipped or fail without an explicit error. No GPU and no
  model inference are required; network access is needed only to obtain
  toolchains and the Jackson artifacts.

