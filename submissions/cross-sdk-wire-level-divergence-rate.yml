model_specificity: model agnostic

domain_specificity: domain agnostic

usage_details: |
  Applied by running a standard test suite across each available SDK
  implementation and comparing the pairwise byte outputs.

  Concrete application: the Model Context Protocol (MCP) has ten first-party
  SDKs. A 40-case differential harness found 26 divergences (D = 0.65)
  across $K = 8$ implementations; eight SDKs were executed, and Ruby and
  Rust were assessed by source inspection and confirmed byte-identical to
  TypeScript. Each runner invokes the same serialisation library and
  configuration the SDK uses at its transport call site rather than
  importing the SDK itself. Recommended confidence interval for reported
  rates: Wilson score at $\alpha = 0.05$; cluster-adjusted Wilson where test
  cases share a generator (input schema, tokenizer, or fuzz seed).

  The rate has a security consequence because MCP defines no canonical
  serialisation, so a signature over transmitted content covers the emitted
  bytes; a record signed by one SDK fails verification under another unless
  both canonicalise first.

known_failure_modes: |
  Runner participation affects the rate in two ways that must be reported
  alongside it. An implementation whose runner fails to execute is dropped
  from the comparison set entirely, lowering $K$ and potentially lowering
  $D$, since that implementation may have been the only source of
  disagreement on some cases; because the case set is taken from the first
  participating runner, dropping that runner can also change $N$. An
  implementation that emits only a subset of the cases has its absent cases
  treated as a distinct value, which counts as a divergence and inflates
  $D$. Report the participating implementations and the case count, not the
  rate alone.

  The metric compares raw bytes; a divergence rate of 1 on raw bytes can be
  0 after canonicalisation. Always report the canonicalisation scheme (or
  its absence) alongside the rate. The rate is also sensitive to test-suite
  completeness: a suite that omits numeric-representation edge points
  reports a lower rate than a suite that includes them.

modality:
  - text
  - structured data

