ai_rmf_characteristics:
  - Valid & Reliable
ai_lifecycle_stages:
  - Build
  - Deploy
  - Operate & Monitor
object_of_measurement:
  - model
  - system
model_specificity: model agnostic
domain_specificity: domain agnostic
usage_details: |
  Use when a system may defer an input to a person or a fallback, and the cost
  of an accepted wrong answer matters: triage, screening, forecasting and
  sensor alerts. Before deployment, compare models or uncertainty scores at the
  same target coverage. In operation, track the accepted-error rate and the
  realised coverage over time with the threshold held fixed.
  Interpret $\hat R$ only together with its coverage. A lower risk obtained by
  abstaining more is not an improvement unless coverage is matched or the cost
  of abstention is stated. Report counts and an interval: binomial (for
  example Clopper-Pearson) for independent test units; a moving-block or
  whole-cluster bootstrap for time series, sites or repeated subjects.
  Scope: applies to any predictor that outputs a per-instance score, given
  labelled calibration and test data. It does not measure probability
  calibration (pair it with the Brier score or expected calibration error), it
  is not a guarantee under distribution shift, and it differs from refusal-rate
  metrics, which count how often a generative system declines a request rather
  than how often its accepted answers are wrong.
known_failure_modes: |
  Calibration-quantile thresholds give no finite-sample guarantee: under shift
  between calibration and use, realised coverage and risk can both move
  sharply. Gaming: a model can lower its reported risk by abstaining more,
  hence the requirement to fix or report coverage. Rare error events, small
  accepted sets and tied scores make $\hat R$ unstable. Treating dependent
  units (hours, sites, repeated subjects) as independent understates
  uncertainty. Thresholds chosen on test data (the retrospective variant) are
  optimistic and must not be deployed. Scores that are not monotone in error
  likelihood make the metric uninformative about the model's accuracy.

