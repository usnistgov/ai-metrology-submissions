  - "Yonatan Geifman and Ran El-Yaniv. Selective Classification for Deep Neural Networks. Advances in Neural Information Processing Systems 30 (NeurIPS 2017). https://papers.nips.cc/paper_files/paper/2017/hash/4a8423d5e91fda00bb7e46540e2b0cf1-Abstract.html"
  - "Hans R. Kunsch. The Jackknife and the Bootstrap for General Stationary Observations. Annals of Statistics 17(3):1217-1241, 1989. https://projecteuclid.org/journals/annals-of-statistics/volume-17/issue-3/The-Jackknife-and-the-Bootstrap-for-General-Stationary-Observations/10.1214/aos/1176347265.full"
