schema_version: "1.0"

name: Selective Risk at Target Coverage
applied_definition: |
  A selective predictor $(f,g)$ answers with $f(x)$ when $g(x)=1$ and abstains
  otherwise. With an uncertainty score $s$ (smaller is more confident) and a
  threshold $t$, $g(x)=\mathbb{1}\{s(x)\le t\}$. For a loss
  $\ell\in[0,1]$, coverage and selective risk are
  $$\Phi(f,g)=\mathbb{E}[g(X)],\qquad
  R(f,g)=\frac{\mathbb{E}[\ell(f(X),Y)\,g(X)]}{\Phi(f,g)}.$$
  $R$ is undefined when $\Phi=0$. For classification $\ell$ is the 0/1 error;
  for regression use $\ell=\mathbb{1}\{|f(x)-y|>\varepsilon\}$ with a declared
  tolerance $\varepsilon$. To report at target coverage $c$, fix $t$ on a
  calibration split disjoint from the test split, as the
  $\lceil nc\rceil$-th smallest of its $n$ scores (ties accepted). On the test
  split, report realised coverage, $\hat R$ = accepted errors / accepted, and
  both counts.
