# --- Section 2: Context and limitations ---
ai_rmf_characteristics:
  - Valid & Reliable
  - Safe
  - Secure & Resilient
  - Accountable & Transparent

primary_tevv_application:
  - Adversarial Robustness Evaluation
  - Language Model Benchmark Evaluation

ai_lifecycle_stages:
  - Build
  - Deploy
  - Operate & Monitor

object_of_measurement:
  - agent
  - model
  - system

model_specificity: model agnostic

domain_specificity: domain agnostic — developed and illustrated in Financial Services

usage_details: |
  Most valuable for continuously verifying, in production, that a generative or agentic
  AI capability still meets the reliability envelope its design-time risk tier assumes —
  and for turning that judgement into an automated continue / escalate / contain decision
  per execution trajectory. The per-axis construction is diagnostic: it identifies which
  reliability dimension (e.g. a low Uncertainty-awareness score signalling confident
  hallucination) is responsible for a failure, rather than reporting only a single
  composite number. Designed for regulated settings (e.g. financial services) where a
  runtime control must be auditable and defensible to an examiner, but the construction
  is domain-agnostic.

known_failure_modes: |
  (1) Evaluation-set representativeness: every score is only as valid as the evaluation
  set is representative of the capability's true operating distribution; sampling bias is
  the dominant source of measurement risk. (2) Dependency on learned verification
  components: groundedness (S1) and semantic similarity (C1/C2) rely on an entailment or
  embedding model that must itself be validated and governed on its own precision/recall,
  or the hard gate inherits its blind spots. (3) Parameter gaming: weights, tolerances,
  and thresholds are governance parameters and can be tuned until a report passes —
  the framework surfaces this as a versioned change but cannot prevent it by
  construction. (4) Ground-truth needs: abstention quality (U2) and selective-prediction
  quality (U3) require knowing which cases would have been answered incorrectly, which is
  not directly computable from production traffic and is proxied at runtime.

modality:
  - text
  - structured data

