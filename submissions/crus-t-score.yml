    Yonatan Geifman, Ran El-Yaniv. "Selective Classification for Deep Neural Networks."
    NeurIPS, 2017. https://arxiv.org/abs/1705.08500
  - >-
    Xuezhi Wang et al. "Self-Consistency Improves Chain of Thought Reasoning in Language
    Models." ICLR, 2023. https://arxiv.org/abs/2203.11171
