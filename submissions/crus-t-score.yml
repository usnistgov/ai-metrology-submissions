implementation_resources:
  - https://github.com/satyakigd/crust

common_variants:
  - Point-estimate gating vs. bootstrap lower-confidence-bound gating for regulatory-grade decisions
  - Composite scalar score vs. per-axis threshold-polygon gating
  - Per-trajectory scoring vs. batch/portfolio roll-up across many runs

related_metrics:
  - Expected Calibration Error (ECE)
  - Area Under the Risk-Coverage Curve (AURC)
  - RAGAS faithfulness / claim-level groundedness
  - Self-consistency agreement (Krippendorff's alpha)

computational_requirements: >-
  Python 3.10+; the score itself has no required runtime dependencies. Sub-metrics that
  need a learned entailment or embedding model (groundedness S1, semantic similarity
  C1/C2) or a task-quality function (Robustness) require those to be supplied and governed
  separately, and may need a GPU depending on the model chosen.

usage_rights: >-
  Reference implementation released under the MIT License. The metric definition is
