# CRUS-T runtime reliability score — submission to the NIST AI Metrology Center.
# Format: SUBMISSION_FORMAT.md, schema v1.0.

schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: "CRUS-T score — a tier-gated runtime reliability score for generative and agentic AI"

applied_definition: |
  CRUS-T is a normalized runtime reliability score for generative and agentic AI. It
  scores a capability, or a single execution trajectory, on four axes — each computed
  from logged execution artefacts and normalized to the [0,1] interval, higher being
  better:

  - Consistency: stability of outputs under resampling and meaning-preserving perturbation.
  - Robustness: retention of task quality under distribution shift, noise, and adversarial pressure.
  - Uncertainty awareness: whether stated confidence tracks actual accuracy.
  - Safety: factual groundedness against cited sources, policy conformance, and only authorized side effects.

  Each axis is gated against a threshold that rises with the capability's assigned risk
  tier, rather than collapsed into a single composite. Safety carries a non-negotiable
  hard gate: a single critical policy violation forces failure regardless of the other
  scores, so a catastrophic failure can never be averaged away. The runtime response
  follows directly — continue (all axes clear the tier's threshold), escalate (an axis
  slips, triggering human review), or contain (an axis is breached, or a critical safety
  violation occurs, forcing a safe mode).

  Full construction — sub-metric definitions, the aggregation rule, and the statistical
  gating criterion — is given in the reference paper and the linked implementation.

submitter_organizations:
