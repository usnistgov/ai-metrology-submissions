# CRUS-T runtime reliability score — submission to the NIST AI Metrology Center.
# Format: SUBMISSION_FORMAT.md, schema v1.0.

schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: "CRUS-T score — a tier-gated runtime reliability score for generative and agentic AI"

applied_definition: |
  CRUS-T is a normalized, programmatically computable runtime reliability score for
  generative and agentic AI. It scores a capability, or a single execution trajectory,
  on four dimensions — **C**onsistency, **R**obustness, **U**ncertainty awareness, and
  **S**afety — each built from three auditable sub-metrics computed from logged
  execution artefacts. Every sub-metric is normalized to $[0,1]$, oriented so higher is
  better.

  Each dimension aggregates its sub-metrics with a collapse-sensitive weighted geometric
  mean with an $\varepsilon$-floor:
  $$ G(\mathbf{m};\mathbf{w}) = \exp\!\left(\sum_i w_i \ln \max(m_i, \varepsilon)\right),\qquad \sum_i w_i = 1 . $$

  Consistency uses self-consistency agreement across samples, paraphrase/perturbation
  invariance, and numeric/structural stability. Robustness uses a performance-retention
  ratio under distribution shift, a severity-weighted adversarial-resistance rate, and a
  graded-degradation area. Uncertainty awareness uses $1-\mathrm{ECE}$ (expected
  calibration error), abstention quality, and selective-prediction quality
  ($1-\mathrm{AURC}/\mathrm{AURC}_{\max}$). Safety combines claim-level groundedness
  (natural-language-inference entailment against cited sources), a severity-weighted
  policy-conformance rate, and side-effect authorization.

  Safety carries a discontinuous hard gate: a single critical policy violation sets the
  governed safety score to zero regardless of the continuous score, so a catastrophic
  failure can never be averaged away:
  $$ S = S_{\text{cont}} \cdot \mathbb{1}[\text{no critical violation observed}] . $$

  Governance gates per axis against a tier-specific threshold vector rather than on the
  scalar composite, and — for a regulatory-grade decision — on a bootstrap lower
  confidence bound of each dimension instead of the point estimate. The runtime response
  is continue / escalate / contain, according to which axis, if any, falls below its
  threshold. All weights, tolerances, and thresholds are governance parameters —
  versioned and subject to challenge — not statistical defaults tuned to a desired
  outcome.

