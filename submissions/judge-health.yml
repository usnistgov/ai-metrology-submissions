related_metrics:
  - >-
    Cohen's kappa: inter-rater reliability for the human reference sample; specified
    in the methodology as a precondition instrument for production-grade validation.

computational_requirements: >-
  Node.js 18 or later. Access to an OpenAI-compatible API (all evaluator inference
  calls execute server-side; no local GPU required). Local filesystem with write
  access for atomic JSON state persistence. No cloud infrastructure required for
  single-user research use.

