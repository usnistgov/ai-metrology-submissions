schema_version: "1.0"

name: "Judge Health \u2014 A Continuous Validation Protocol for Model-Based Evaluators"

applied_definition: |
  Judge Health is a measurement methodology for continuously validating the reliability
  of a binary model-based evaluator (LLM-as-judge). The object of measurement is the
  evaluator system itself, not the AI system it evaluates.

  **Reliability profile** — computed per evaluation run over a representative
  human-reference sample, with the positive class fixed to FAIL (the minority,
  high-stakes class):

  $$\text{FAIL Recall (Sensitivity)} = \frac{TP}{TP + FN}$$

  $$\text{PASS Recall (Specificity)} = \frac{TN}{TN + FP}$$

  Both are reported with 95% Wilson score confidence intervals, which outperform Wald
  intervals at extreme proportions and small sample sizes. Overall agreement
  ($$OA = \frac{TP + TN}{n}$$) is reported for reference; it is not the primary
  decision criterion. CI width per class is also reported to quantify uncertainty
  relative to sample size.

  **Two analytically separate evidence streams**:
  - *Representative sample*: reflects the true case distribution; valid for
    population-level reliability estimates.
  - *Targeted/risk sample*: known failures and high-stakes edge cases;
    investigation only — never mixed into population-level estimates.

  **Metric triggers and change triggers** — thresholds are configured per deployment
  context. A trigger signals that the observed metric crossed a configured boundary
  and investigation is required; it is not a verdict. No universal threshold is defined.

  **Diagnosis before intervention** — before a candidate evaluator is created, a
  root-cause diagnosis category is recorded (e.g., evaluator rubric, reference process
  degradation, taxonomy shift). Intervention without diagnosis is blocked.

  **Candidate isolation** — a candidate evaluator is always a new, independent version.
  The active evaluator is never mutated. Candidate runs are tracked separately from
  baseline runs. No result from a candidate run is back-propagated to the active
  evaluator.

  **Revalidation** — a candidate is run from scratch against the same representative
  human-reference sample as the baseline. No pre-computed judgments are reused; no
  fixture fallback is permitted in production.

  **Human accept/reject decision** — promotion requires an explicit human decision.
  The decision-maker reviews the candidate's class-aware reliability profile relative
  to the baseline, against deployment-specific acceptance criteria that may incorporate
  representative reliability evidence, targeted/risk evidence, or both.
  There is no automatic promotion and no universal reliability score or threshold.

  **Historical immutability** — completed runs are sealed and append-only. Every
  accept/reject decision is recorded with timestamp, version identifiers, and human
  rationale. History cannot be rewritten.

