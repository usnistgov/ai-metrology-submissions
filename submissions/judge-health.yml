model_specificity: "model specific \u2014 LLM-based evaluators (LLM-as-judge)"

domain_specificity: domain agnostic

usage_details: |
  Highest value when:
  1. The evaluator's error distribution is asymmetric across classes. Deployment-specific
     risk determines which error modes and classes require priority attention; aggregate
     agreement can conceal poor reliability on minority or high-stakes classes.
  2. A rubric change, model version change, or taxonomy update must be accepted or
     rejected on reproducible evidence rather than intuition. Candidate isolation
     ensures the active evaluator is never silently mutated.
  3. An auditable calibration record is required: each accept/reject decision is sealed
     with timestamp, version identifiers, and human rationale.
  4. The evaluation workload cannot be fully human-reviewed at scale, but a
     representative human-reference sample is feasible.

  Least value when: the evaluation task produces near-perfect evaluator agreement with
  no class imbalance across the population, or when model-based evaluation is not used.

known_failure_modes: |
  1. Correlated evaluator errors: when the evaluator model and the evaluated model
     share the same architecture or provider, their errors may be correlated,
     undermining the independence assumption. Mitigation: document provider and
     architecture overlap per deployment.
  2. IRR not computationally enforced: inter-rater reliability (IRR) is specified in
     the methodology as a precondition for production-grade validation but is not yet
     enforced as an automated gate before a reference session is accepted (v0.2).
  3. Sampling variance at small n: class-specific confidence intervals can remain wide
     when a representative sample contains few examples of a class. Point estimates must
     be interpreted alongside their confidence intervals, not in isolation.
  4. Binary labels only: the current implementation supports only binary PASS/FAIL
     classification. Multi-class taxonomies are not yet supported.
  5. Reference label contamination: if the evaluator receives ground-truth labels,
     prior judgments, or expected results during evaluation, the blind evaluation
     assumption is violated. All evaluator calls in the reference implementation are
     server-side only; reference labels are never passed to the evaluator prompt.
  6. No temporal trend analysis: each run is an independent point-in-time measurement;
     gradual evaluator drift across sessions is not tracked.

