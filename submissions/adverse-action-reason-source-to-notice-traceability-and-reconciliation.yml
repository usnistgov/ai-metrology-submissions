schema_version: "1.0"

name: Adverse-Action Reason Source-to-Notice Traceability and Reconciliation

applied_definition: |
  A qualitative, record-level consistency method for credit decision systems
  that use AI or machine learning, using rule-based conformance checking
  principles. For each recorded declined decision, it compares the declared,
  versioned decision components, adverse source drivers, reason-selection
  convention, mappings, recorded reason outputs, and rendered notice segments.
  Input validation errors prevent reconciliation; executed checks report named
  exceptions, counts, stage status, and record-level details rather than a
  weighted composite score. A clean result requires successful validation,
  execution of all applicable source-to-reason and rendered-notice checks, and
  zero exceptions. It establishes consistency with the supplied records and
  declared rules only, without establishing truthfulness, causal faithfulness,
  legal sufficiency, or recipient understanding.

