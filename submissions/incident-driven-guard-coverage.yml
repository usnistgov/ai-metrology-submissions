schema_version: "1.0"

name: Incident-Driven Guard Coverage

applied_definition: |
  Measures how well regression-tested guards on an AI agent's tool use keep up
  with the risky actions agents are observed to attempt.

  **Observations.** An observation is either:
  - an **incident**: an action the tools allowed that was later found harmful,
    recorded in an incident register; or
  - a **policy refusal**: an attempt by an agent client refused by a guard
    listed in the manifest, logged with its refusal reason.

  A manifest declares the guards, their entry points (where a guard
  intercepts an action, such as the agent's shell or a tool server), their
  regression tests, and which clients are agents.

  An observation's detection time is the refusal's log time, or the
  detection time recorded in the incident register.

  A guard that does not log refusals contributes none, and refusals not about
  the action's safety are not observations. A declared, versioned
  classification rule maps each observation to a **pattern**.

  **Unit.** The unit is an agent instance: one agent context, such as a
  subagent, identified from an id the agent client attaches to each logged
  call. A pattern counts once per instance. An observation with no known
  instance counts in items 1-3 but not in item 4.

  Let $K$ be the patterns observed so far. $G \subseteq K$ holds the patterns
  that, at every entry point where they were observed, have a guard and a
  regression test in the manifest. The test replays the observed action there
  and asserts it is refused. Items 1-3 are cumulative:

  1. **Guarded share** $|G|/|K|$, with each unguarded pattern listed with its
     age since first occurrence (detection if unknown,
     then a lower bound).
  2. **Time to guard**: for each pattern in $G$, from first occurrence to the
     first commit at which guard and test are in place at every such entry
     point; report the median of exact values. If any occurrence time is
     unknown, measure from the earliest occurrence or detection time and
     mark the value a lower bound. A pattern guarded before it was first observed has no
     value.
  3. **Discovery trend**: new patterns per declared batch of agent instances,
     each placed by its first occurrence (detection if unknown); patterns
     seen before the first instance are reported separately.
  4. **Unseen-pattern estimate**: take a window of $n$ agent instances with
     fixed agent, tool and guard versions, including instances with no
     observations. Let $Q_1$ and $Q_2$ be the numbers of patterns recorded in
     exactly one and exactly two instances. Then

     $$\hat{U} = \frac{Q_1}{n}$$

     estimates $U_n$, slightly high when instances are independent. $U_n$ is
     the expected number of patterns not recorded in the window that are
     recorded (as a logged refusal or a register entry) in the next
     instance. $U_n$ is an upper bound on the probability that the next
     instance records a new pattern. Report $\hat{U}$ with $n$, $Q_1$ and
     $Q_2$ only when $n \ge 100$ (a threshold chosen by the submitter) and
     no policy refusal in the window lacks an instance. Otherwise report only
     the counts. Incidents with no instance are reported as excluded, so
     $\hat{U}$ then covers only refusals. The window restarts when any
     version changes.

