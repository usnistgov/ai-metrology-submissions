schema_version: "1.0"

name: AI Inventory Fidelity

applied_definition: |
  Measures whether an inventory of an AI system's components (prompt templates,
  tool definitions, guardrail and policy configurations, and model and dataset
  references by digest) describes what is actually deployed, by reconciling
  it, unmodified, against an observation of the deployment.

  The inventory $I$ maps each active name to a content hash and lists retired
  names; a malformed inventory (a name both active and retired, or
  duplicated) is not measured. An observation source (a file scan of the
  deployed artifact, or any listing that carries content digests) yields $P$,
  mapping each present name to a hash. Each run reconciles $I$ against one
  source, the reference for that run only: no single source, the inventory
  included, is assumed complete or correct. An observed item that is
  duplicated, unreadable,
  not valid in its canonical form, or a reference with no content digest is
  reported as an error, and its name is withheld from classification on both
  sides. Hashes are SHA-256 over one canonical form,
  used at both registration and observation:
  - text (prompts, YAML configs): UTF-8, one leading BOM removed, CRLF and
    CR rewritten to LF;
  - JSON: re-serialised with sorted keys, no insignificant whitespace, and
    numbers as Python's `json` module writes them;
  - model and dataset references: the declared `sha256:` digest itself. A
    label before `@` is not compared, and a tag-only reference is an error.

  Every other name in $I \cup P$ falls in exactly one class:

  - **matched**: active, present, same hash;
  - **modified**: active, present, different hash;
  - **vanished**: active, absent;
  - **phantom**: present, not in $I$;
  - **resurrected**: retired, present;
  - **retired-absent**: retired, absent (correct; not counted).

  With counts $m, d, v, p, z$:

  $$\mathrm{precision} = \frac{m}{m+d+v}, \qquad \mathrm{recall} = \frac{m}{m+d+p+z}$$

  Either ratio is undefined when its denominator is 0. The five counts and the
  names in every non-matched class are always reported with the ratios, per
  source.

