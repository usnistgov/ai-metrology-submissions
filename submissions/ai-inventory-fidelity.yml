usage_details: |
  System prompts, tool schemas and guardrail policies shape an AI system's
  behaviour but are not tracked by package managers. AI-BOM formats (the SPDX
  3.0 AI profile, CycloneDX ML-BOM) record what a system is said to contain;
  this method checks such a record, down to file content, against what is
  deployed. NIST AI RMF GOVERN 1.6 calls for mechanisms to inventory AI
  systems; this is one way to test whether an inventory is accurate.

  Run it against each independent source available, at every deployment
  and on a schedule in operation, and track the trend. A component classed
  differently by two sources means one source is wrong: investigate it.
  Follow-up:
  modified, review then re-register; vanished, retire or restore; phantom,
  register and review; resurrected, investigate. Renames are never inferred:
  an unrecorded rename is one vanished plus one phantom.

  Example. An inventory lists a system prompt, two tools and a guardrail
  policy, plus one retired tool. The deployment has an edited prompt, the two
  tools, an unregistered third tool, the retired tool, and no guardrail
  policy. Counts: matched 2, modified 1, vanished 1, phantom 1, resurrected 1.
  Precision is 2/4 and recall is 2/5.

  Grounding: a newly proposed method. The underlying measurement is
  precision and recall of a claimed
  component list against ground truth. Balliu et al. (2023) define precision
  as "the share of dependencies in the SBOM that are correct with respect to
  the ground truth", with dependencies "identical if their name and version
  match precisely"; a version mismatch thus counts against both ratios, as
  **modified** does here. Yu et al. (2024) compare "the reported libraries and
  the ones actually installed". This method applies that measurement to an AI
  inventory, using content hashes where artifacts carry no version. The
  implementation is a single-author proof of concept used in one environment;
  it is not production-ready and has not been independently replicated.

known_failure_modes: |
  1. An inventory generated from the scan, or by the same deploy step, scores
     100% by construction. It must be maintained independently.
  2. Each source is itself untrusted, and components it cannot see (loaded
     at run time, fetched remotely, outside its layout) are in no class. List
     what each source covered. Sources must be independent: sources derived
     from one another (a CMDB fed by the same deploy pipeline as the
     manifest) count as one. The reference implementation observes one
     source type: a file scan of a fixed layout (prompts/, tools/,
     guardrails/, models.json).
  3. If registration and observation normalise content differently,
     unchanged components read as modified. Use one canonicalisation routine
     for both.
  4. A result is a snapshot of one environment at one time.
  5. Fidelity is not quality. An accurate inventory of an unsafe system
     scores 100%.

